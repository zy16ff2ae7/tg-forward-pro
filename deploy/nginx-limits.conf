# Лимиты запросов для tg-forward.
# Установка: cp deploy/nginx-limits.conf /etc/nginx/conf.d/tg-forward-limits.conf
# (conf.d подключается внутри http-контекста — там limit_req_zone и живёт).
# Без этого файла сайт из deploy/nginx.conf не пройдёт `nginx -t`:
# директивы limit_req ссылаются на зоны ниже.
#
# Значения с запасом под bursts: мини-апп при старте дёргает несколько
# /api-эндпоинтов разом, а Telegram шлёт вебхуки пачками.

# JSON-API мини-аппа: 10 запросов/сек со всплеском до 30
limit_req_zone $binary_remote_addr zone=tgf_api:10m rate=10r/s;

# Вебхук Bot API: Telegram шлёт пачками — 20/сек со всплеском до 60
limit_req_zone $binary_remote_addr zone=tgf_webhook:10m rate=20r/s;
