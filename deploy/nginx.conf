# /etc/nginx/sites-available/tg-forward
# Активация: ln -s /etc/nginx/sites-available/tg-forward /etc/nginx/sites-enabled/
#
# Замените YOUR_DOMAIN на свой домен (три места).

server {
    listen 80;
    server_name YOUR_DOMAIN;

    # Certbot по HTTP-01 должен дойти до файлов подтверждения —
    # без этого location сертификат не выпустится.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name YOUR_DOMAIN;

    # Раскомментируйте после выпуска сертификата
    # (certbot --nginx сделает это сам). Пока закомментировано —
    # иначе nginx не стартует: файлов сертификата ещё нет.
    # ssl_certificate     /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;
    # ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 100m;

    # Вебхук Bot API
    location /webhook {
        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Мини-апп (/app/) и его API (/api/).
    # Бот слушает только 127.0.0.1:8080 — наружу его отдаёт nginx.
    # Без этого location кабинет в Telegram не откроется: будет 404.
    location / {
        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;

        # WebSocket на будущее (мини-апп может перейти на ws)
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
    }
}
