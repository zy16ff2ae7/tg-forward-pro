# /etc/nginx/sites-available/tg-forward
# Активация: ln -s /etc/nginx/sites-available/tg-forward /etc/nginx/sites-enabled/
#
# Замените YOUR_DOMAIN на свой домен (три места).
#
# Версия «до certbot»: отдаём сервис по HTTP, чтобы проверить, что он жив,
# ещё без сертификата. Как только домен указывает на сервер, запустите
# `certbot --nginx -d YOUR_DOMAIN` — он сам добавит блок `listen 443`,
# пропишет ssl_certificate и сделает редирект 301 → https. Править этот
# файл вручную после certbot не нужно.
#
# ⚠️ Если порт 443 уже занят stream-блоком с ssl_preread (VPN/xray на том же
# сервере), сайт на `listen 443 ssl` не поднимется — соединение перехватит
# VPN и клиент увидит чужой сертификат. Тогда используйте свободный порт,
# например заменив строку в этом файле на `listen 8443 ssl;`, а в карту SNI
# stream-блока добавьте:  YOUR_DOMAIN  127.0.0.1:8443;   (перед `default`).
# Скрипт deploy/https.sh --auto-sni делает это сам.

server {
    listen 80;
    server_name YOUR_DOMAIN;

    # Certbot по HTTP-01 должен дойти до файлов подтверждения —
    # без этого location сертификат не выпустится.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Апдейты Telegram и JSON мини-аппа — килобайты; 100m здесь не нужно.
    client_max_body_size 1m;

    # Вебхук Bot API (нужен, если позже переключимся на webhook).
    # Зоны tgf_* — в deploy/nginx-limits.conf (копируется в conf.d/).
    location /webhook {
        limit_req          zone=tgf_webhook burst=60 nodelay;
        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # JSON-API мини-аппа — отдельно от статики: здесь нужен rate limit.
    location /api/ {
        limit_req          zone=tgf_api burst=30 nodelay;
        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Мини-апп (/app/) и его API (/api/).
    # Бот слушает только 127.0.0.1:8080 — наружу его отдаёт nginx.
    # Без этого location кабинет в Telegram не откроется: будет 404.
    location / {
        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;

        # WebSocket на будущее (мини-апп может перейти на ws)
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
    }
}
