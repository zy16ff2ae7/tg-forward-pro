<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>ДОЧА · Оплата абонемента</title>
<style>
  /* Палитра один в один с кабинетом (webapp/styles.css). Страница живёт вне
     Telegram и стилей кабинета не подключает: её открывают в обычном браузере,
     где нет ни темы клиента, ни его шрифтов — поэтому всё своё, внутри файла. */
  :root {
    color-scheme: dark;
    --bg: #0A0510;
    --card: #180C22;
    --text: #F8EDF7;
    --muted: #B9A0C9;
    --line: rgba(255, 130, 205, 0.16);
    --accent: #FF3D9A;
    --accent-2: #C31E9B;
    --violet: #A855F7;
    --pink: #FFC2E2;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 1.5rem 1rem 3rem; min-height: 100vh;
    font: 16px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: var(--text);
    background:
      radial-gradient(120% 60% at 50% -10%, rgba(255, 61, 154, 0.22), transparent 62%),
      radial-gradient(90% 50% at 100% 8%, rgba(168, 85, 247, 0.16), transparent 60%),
      linear-gradient(180deg, #0F0618 0%, #0A0510 52%, #060309 100%);
    background-attachment: fixed;
  }
  main { max-width: 30rem; margin: 0 auto; }
  .brand { display: flex; align-items: center; gap: .55rem; margin: 0 0 1.1rem; }
  .brand svg { width: 34px; height: 34px; flex: none;
               filter: drop-shadow(0 0 10px rgba(255, 61, 154, 0.55)); }
  .brand b { font-size: 1.05rem; letter-spacing: .12em; }
  h1 { font-size: 1.35rem; margin: 0 0 .35rem; }
  .lead { color: var(--muted); margin: 0 0 1.5rem; font-size: .95rem; }
  fieldset { border: 0; padding: 0; margin: 0 0 1.5rem; }
  legend { padding: 0 0 .6rem; font-size: .8rem; letter-spacing: .04em;
           text-transform: uppercase; color: var(--muted); }
  .grid { display: grid; gap: .5rem; grid-template-columns: repeat(2, 1fr); }
  .choice input { position: absolute; opacity: 0; pointer-events: none; }
  .choice span {
    display: block; padding: .7rem .5rem; text-align: center; cursor: pointer;
    border: 1px solid var(--line); border-radius: 14px; background: var(--card);
    transition: border-color .15s, background .15s, box-shadow .15s;
  }
  .choice input:checked + span {
    border-color: var(--accent); background: rgba(255, 61, 154, 0.14);
    box-shadow: 0 0 18px rgba(255, 61, 154, 0.28);
  }
  .choice input:focus-visible + span { outline: 2px solid var(--violet); outline-offset: 2px; }
  .choice small { display: block; color: var(--muted); font-size: .8rem; }
  button {
    width: 100%; padding: .9rem 1rem; font: inherit; font-weight: 700;
    color: #fff; border: 0; border-radius: 14px; cursor: pointer;
    background: linear-gradient(135deg, #FF4FA6 0%, #C31E9B 100%);
    box-shadow: 0 0 26px rgba(255, 61, 154, 0.34);
  }
  button[disabled] { opacity: .55; cursor: default; box-shadow: none; }
  .note { margin: 1rem 0 0; font-size: .85rem; color: var(--muted); }
  .box { margin: 1.5rem 0 0; padding: 1rem; border: 1px solid var(--line);
         border-radius: 18px; background: var(--card); }
  .box h2 { font-size: 1rem; margin: 0 0 .6rem; }
  .row { display: flex; justify-content: space-between; gap: .75rem; padding: .3rem 0; }
  .row b { font-variant-numeric: tabular-nums; }
  code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
         font-size: .85rem; word-break: break-all; color: var(--pink); }
  .error { color: #FB7185; }
  a { color: var(--pink); }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <!-- Знак бренда — та же корона, что в кабинете (webapp/index.html), только
       вписанная в страницу: человек попадает сюда по ссылке из бота и должен
       сразу видеть, что оплата на нашем сервисе, а не на чужом. -->
  <div class="brand">
    <svg viewBox="0 0 120 120" aria-hidden="true">
      <defs>
        <linearGradient id="payCrown" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#FFFFFF" />
          <stop offset="100%" stop-color="#FFA6D6" />
        </linearGradient>
      </defs>
      <path d="M28 86V48l16 14 16-28 16 28 16-14v38z" fill="url(#payCrown)" />
      <rect x="26" y="84" width="68" height="15" rx="5.5" fill="url(#payCrown)" />
      <circle cx="28" cy="45" r="5.4" fill="#A855F7" />
      <circle cx="60" cy="31" r="6.2" fill="#22D3EE" />
      <circle cx="92" cy="45" r="5.4" fill="#A855F7" />
    </svg>
    <b>ДОЧА</b>
  </div>
  <h1>Оплата абонемента</h1>
  <p class="lead">
    Страница сервиса вне Telegram. Внутри бота абонемент продаётся за звёзды,
    картой и криптой платят здесь.
  </p>

  <div id="status" class="note" role="status">Загружаем условия…</div>

  <form id="form" hidden>
    <fieldset>
      <legend>Срок</legend>
      <div class="grid" id="periods"></div>
    </fieldset>
    <fieldset>
      <legend>Способ оплаты</legend>
      <div class="grid" id="methods"></div>
    </fieldset>
    <button type="submit" id="submit">Продолжить</button>
    <p class="note" id="hint"></p>
  </form>

  <section class="box" id="result" hidden aria-live="polite"></section>

  <p class="note" id="back" hidden></p>
</main>

<script>
/* Страница живёт вне Telegram: WebApp-объекта здесь нет, авторизация — только
   подписанный токен из адреса. Токен ничего не читает: он даёт право создать
   счёт на своего же user_id, и живёт час. */
const token = new URLSearchParams(location.search).get('t') || '';
const statusEl = document.getElementById('status');
const form = document.getElementById('form');
const periodsEl = document.getElementById('periods');
const methodsEl = document.getElementById('methods');
const resultEl = document.getElementById('result');
const submitEl = document.getElementById('submit');
const hintEl = document.getElementById('hint');
const backEl = document.getElementById('back');

const METHOD_LABELS = { yookassa: 'Карта / СБП', usdt: 'USDT (TRC-20)' };

function esc(value) {
  return String(value == null ? '' : value).replace(/[&<>"']/g, (ch) => (
    { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]
  ));
}

async function api(path, options) {
  const response = await fetch(path, {
    headers: { 'Content-Type': 'application/json' },
    ...options,
  });
  let data = {};
  try { data = await response.json(); } catch (err) { data = {}; }
  if (!response.ok) throw new Error(data.error || 'Не получилось. Попробуйте позже.');
  return data;
}

function choice(name, value, label, sub, checked) {
  const id = `${name}-${value}`;
  return `<label class="choice" for="${id}">
    <input type="radio" name="${name}" id="${id}" value="${esc(value)}"${checked ? ' checked' : ''}>
    <span>${esc(label)}${sub ? `<small>${esc(sub)}</small>` : ''}</span>
  </label>`;
}

function priceFor(period, method) {
  if (method === 'usdt') return `${period.usdt} USDT`;
  return `${period.rub} ₽`;
}

function selected(name) {
  const input = form.querySelector(`input[name="${name}"]:checked`);
  return input ? input.value : '';
}

let info = null;

function renderPeriods() {
  const method = selected('method') || (info.methods[0] || '');
  const current = selected('months') || String(info.months);
  periodsEl.innerHTML = info.periods.map((period) => choice(
    'months',
    period.months,
    `${period.months} мес.`,
    priceFor(period, method),
    String(period.months) === current,
  )).join('');
}

async function load() {
  if (!token) {
    statusEl.className = 'note error';
    statusEl.textContent = 'В ссылке нет токена. Откройте оплату заново из бота.';
    return;
  }
  try {
    info = await api(`/api/pay/info?t=${encodeURIComponent(token)}`);
  } catch (err) {
    statusEl.className = 'note error';
    statusEl.textContent = err.message;
    return;
  }
  methodsEl.innerHTML = info.methods.map((method, index) => choice(
    'method', method, METHOD_LABELS[method] || method, '', index === 0,
  )).join('');
  renderPeriods();
  methodsEl.addEventListener('change', renderPeriods);
  statusEl.hidden = true;
  form.hidden = false;
  if (info.bot_url) {
    backEl.hidden = false;
    backEl.innerHTML = `После оплаты доступ включится сам — подтверждение придёт
      в <a href="${esc(info.bot_url)}">бота</a>.`;
  }
}

function discountNote(invoice) {
  /* Счёт уже дешевле тарифа — называем причину, иначе «почему так» повиснет. */
  const pct = Number(invoice.discount_percent) || 0;
  return pct ? `<p class="note">💸 Применена скидка ${pct}% по промокоду.</p>` : '';
}

function showYookassa(invoice) {
  resultEl.hidden = false;
  resultEl.innerHTML = `<h2>Счёт на ${esc(invoice.amount)} ₽ создан</h2>
    ${discountNote(invoice)}
    <p class="note">Открываем страницу банка. Если она не открылась —
    <a href="${esc(invoice.url)}">перейдите по ссылке</a>.</p>`;
  /* Переход, а не автоматический popup: браузеры блокируют window.open
     вне обработчика клика, и человек остался бы на пустой странице. */
  location.href = invoice.url;
}

function showUsdt(invoice) {
  resultEl.hidden = false;
  resultEl.innerHTML = `<h2>Перевод USDT</h2>
    <div class="row"><span>Сеть</span><b>${esc(invoice.network)}</b></div>
    <div class="row"><span>Сумма</span><b>${esc(invoice.amount.toFixed(3))} USDT</b></div>
    ${discountNote(invoice)}
    <div class="row"><span>Кошелёк</span><code>${esc(invoice.wallet)}</code></div>
    <p class="note">Отправьте <b>ровно эту сумму</b>: последние три знака —
    идентификатор вашего платежа. Доступ включится автоматически после
    подтверждения в сети, обычно за 1–3 минуты.</p>`;
  resultEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

form.addEventListener('submit', async (event) => {
  event.preventDefault();
  const method = selected('method');
  const months = Number(selected('months')) || info.months;
  submitEl.disabled = true;
  hintEl.className = 'note';
  hintEl.textContent = 'Создаём счёт…';
  try {
    const invoice = await api('/api/pay/start', {
      method: 'POST',
      body: JSON.stringify({ t: token, method, months }),
    });
    hintEl.textContent = '';
    if (invoice.method === 'usdt') showUsdt(invoice);
    else showYookassa(invoice);
  } catch (err) {
    hintEl.className = 'note error';
    hintEl.textContent = err.message;
  } finally {
    submitEl.disabled = false;
  }
});

load();
</script>
</body>
</html>
